name: QA PDV Better — Windows Desktop
on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-f01-f06:
    name: QA F01–F54 — jornadas completas do PDV
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar aplicativo e preload
        run: npm run build
      - name: Testar F01–F06 em Electron real com SQLite fictício isolado
        run: npm run test:flows:f01-f06
      - name: Testar F07–F14 com cadastros, perfis e desativação lógica
        run: npm run test:flows:f07-f14
      - name: Testar F15–F30 com frente de caixa, pagamentos e TCP de teste
        run: npm run test:flows:f15-f30
      - name: Testar F31–F40 com caixa multterminal, vendas e estoque real
        run: npm run test:flows:f31-f40
      - name: Testar F41–F50 com financeiro, relatórios e periféricos TCP
        run: npm run test:flows:f41-f50
      - name: Testar F51–F54 com servidor LAN, terminal remoto e restauração SQLite
        run: npm run test:flows:f51-f54
      - name: Testar E01–E12 com falhas de autenticação, pagamento, periféricos, rede e concorrência
        run: npm run test:flows:e01-e12
  windows-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar domínio, migrações e transações
        run: npm test
      - name: Compilar React e IPC canônico
        run: npm run build
      - name: Smoke Electron real, sem mocks
        run: npm run test:desktop
      - name: Gerar instalador NSIS
        run: npm run dist:win
      - name: Instalar NSIS silenciosamente e testar o executável instalado
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "*.exe" | Where-Object { $_.Name -like "*Setup*" } | Select-Object -First 1
          if (-not $installer) { throw "Instalador NSIS ausente" }
          $destination = Join-Path $env:RUNNER_TEMP "PDV-Better-Installed"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$destination" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Instalação falhou com código $($p.ExitCode)" }
          $exe = Join-Path $destination "PDV Better.exe"
          if (!(Test-Path $exe)) { throw "Executável instalado ausente: $exe" }
          $env:PDV_TEST_APP_EXECUTABLE = $exe
          $env:PDV_TEST_USER_DATA = Join-Path $env:RUNNER_TEMP "PDV-Better-Installed-Data"
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { throw "Smoke do executável instalado falhou" }
      - name: Gerar SHA256 do instalador
        shell: pwsh
        run: |
          Get-ChildItem release -Filter "*Setup*.exe" | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Add-Content "release/SHA256SUMS.txt"
          }
          if (!(Test-Path "release/SHA256SUMS.txt")) { throw "Checksum não criado" }
      - name: Disponibilizar instalador da versão aprovada
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Better-Win10-11-${{ matrix.os }}
          path: |
            release/*Setup*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
