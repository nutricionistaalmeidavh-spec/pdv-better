name: QA PDV Better
on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Validar arquivos de build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/index.html")) { throw "Falta dist/index.html" }
          if (!(Test-Path "electron/main.cjs")) { throw "Falta Electron main" }
          if (!(Test-Path "electron/preload.cjs")) { throw "Falta preload compilado" }

      - name: Gerar instalador de teste Windows 10/11
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: PDV-Better-Win10-11
          path: release/*.exe
          if-no-files-found: error
